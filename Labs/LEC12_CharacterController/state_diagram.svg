<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: sans-serif; }
      .edge { fill: none; stroke: #334155; stroke-width: 2.4; marker-end: url(#arrow); }
      .label { font-size: 13px; fill: #475569; }
    </style>
  </defs>
  <rect width="960" height="440" rx="18" fill="#f8fafc"/>
  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Boy State Machine</text>

  <circle cx="48" cy="174" r="7" fill="#0f172a"/>
  <path class="edge" d="M55 174 H93"/>
  <rect x="108" y="138" width="145" height="72" rx="36" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="180" y="181" text-anchor="middle" font-size="21" font-weight="700" fill="#1e3a8a">IDLE</text>
  <rect x="390" y="138" width="145" height="72" rx="36" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="462" y="181" text-anchor="middle" font-size="21" font-weight="700" fill="#166534">RUN</text>
  <rect x="700" y="138" width="165" height="72" rx="36" fill="#f3e8ff" stroke="#9333ea" stroke-width="2.5"/>
  <text x="782" y="181" text-anchor="middle" font-size="20" font-weight="700" fill="#6b21a8">AUTO_RUN</text>
  <rect x="390" y="310" width="145" height="72" rx="36" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
  <text x="462" y="353" text-anchor="middle" font-size="21" font-weight="700" fill="#92400e">SLEEP</text>

  <path class="edge" d="M253 158 H382"/>
  <text class="label" x="317" y="149" text-anchor="middle">LEFT / RIGHT down</text>
  <path class="edge" d="M390 191 H261"/>
  <text class="label" x="326" y="228" text-anchor="middle">all direction keys up</text>

  <path class="edge" d="M178 138 C210 75 747 75 780 130"/>
  <text class="label" x="478" y="80" text-anchor="middle">A (IDLE only)</text>
  <path class="edge" d="M700 198 C565 278 300 278 220 210"/>
  <text class="label" x="468" y="270" text-anchor="middle">5 seconds elapsed</text>

  <path class="edge" d="M780 138 C735 112 595 112 535 150"/>
  <text class="label" x="650" y="113" text-anchor="middle">direction key: cancel AUTO_RUN</text>

  <path class="edge" d="M220 210 C290 280 380 293 420 310"/>
  <text class="label" x="295" y="278" text-anchor="middle">5 seconds idle</text>
  <path class="edge" d="M390 345 C315 330 252 278 210 210"/>
  <text class="label" x="292" y="346" text-anchor="middle">SPACE</text>
  <path class="edge" d="M535 326 C600 275 555 228 510 207"/>
  <text class="label" x="595" y="282" text-anchor="middle">LEFT / RIGHT down</text>

  <text x="480" y="414" text-anchor="middle" font-size="12" fill="#64748b">AUTO_RUN: faster, enlarged, invincible; automatically reverses at screen edges</text>
</svg>
